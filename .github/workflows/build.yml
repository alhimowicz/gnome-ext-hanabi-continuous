name: Validate and package Hanabi Continuous

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UUID: hanabi-continuous@alhimowicz.github.io

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gettext libglib2.0-bin gjs gir1.2-gtk-4.0 gir1.2-gstreamer-1.0 dbus-x11
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Test renderer with real Gio and in-memory settings
        run: dbus-run-session -- npm run test:gjs
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UUID }}.shell-extension.zip
          path: dist/${{ env.UUID }}.shell-extension.zip
          archive: false
          if-no-files-found: error

  release:
    needs: check-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.UUID }}.shell-extension.zip
          path: dist
          skip-decompress: true
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.shell-extension.zip --generate-notes --repo "${GITHUB_REPOSITORY}"
